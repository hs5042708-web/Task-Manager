<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professional Todo List</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="main-layout">
      <aside class="sidebar">
        <div class="logo">
          <i class="fa-solid fa-clipboard-check"></i>
          <span>Task Manager</span>
        </div>

        <nav class="menu">
          <button class="filter-btn active" data-filter="all">
            <i class="fa-solid fa-house"></i> All Tasks
          </button>
          <button class="filter-btn" data-filter="completed">
            <i class="fa-solid fa-check-double"></i> Completed
          </button>
          <button class="filter-btn" data-filter="incomplete">
            <i class="fa-solid fa-clock"></i> Incomplete
          </button>
          <button class="filter-btn" data-filter="in-progress">
            <i class="fa-solid fa-spinner fa-spin-pulse"></i> In Progress
          </button>
        </nav>

        <hr style="border: 0.5px solid #444; margin: 20px 0" />

        <div class="custom-lists">
          <h3
            style="
              color: #888;
              font-size: 12px;
              text-transform: uppercase;
              padding-left: 20px;
              margin-bottom: 10px;
            "
          >
            My Lists
          </h3>
          <nav class="category-list" id="category-list">
            <button class="filter-btn category-btn" data-category="Work">
              <span class="category-info">
                <span class="aesthetic-icon">📄</span> Work
              </span>
              <i
                class="fa-solid fa-trash-can delete-category-btn"
                title="Delete List"
              ></i>
            </button>

            <button class="filter-btn category-btn" data-category="Shopping">
              <span class="category-info">
                <span class="aesthetic-icon">🛍️</span> Shopping
              </span>
              <i
                class="fa-solid fa-trash-can delete-category-btn"
                title="Delete List"
              ></i>
            </button>

            <button class="filter-btn category-btn" data-category="Personal">
              <span class="category-info">
                <span class="aesthetic-icon">🎀</span> Personal
              </span>
              <i
                class="fa-solid fa-trash-can delete-category-btn"
                title="Delete List"
              ></i>
            </button>
          </nav>

          <div
            class="add-category-input"
            style="padding: 10px 20px; display: flex; gap: 5px"
          >
            <input
              type="text"
              id="new-category-name"
              placeholder="New List..."
              style="
                background: #2c3e50;
                border: 1px solid #444;
                color: white;
                border-radius: 4px;
                padding: 5px;
                width: 100%;
              "
            />
            <button
              id="add-category-btn"
              style="
                background: #3498db;
                border: none;
                color: white;
                border-radius: 4px;
                padding: 5px 10px;
                cursor: pointer;
              "
            >
              +
            </button>
          </div>
        </div>
      </aside>

      <main class="content">
        <header>
          <h1>My To-Do List</h1>
          <p id="date-display"></p>
        </header>

        <div class="input-section">
          <input
            type="text"
            id="todo-input"
            placeholder="Add a new task here..."
          />
          <button id="add-btn">Add Item</button>
        </div>

        <ul id="todo-list"></ul>
      </main>
    </div>

    <div id="simple-toast" class="toast-hidden">Update Successful!</div>

    <script src="script.js"></script>
  </body>
</html>
